name: Markdown PDFs

on:
  workflow_dispatch:

jobs:
  generate-pdf:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Terraform docs
        uses: terraform-docs/gh-actions@v1.2.0
        with:
          working-dir: .
          config-file: .terraform-docs.yml

      - name: Install pandoc and LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-latex-base texlive-latex-extra texlive-xetex texlive-lang-japanese fonts-ipaexfont fonts-noto-color-emoji

      - name: Convert Markdown files to PDF
        id: convert
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.md')

          if [ "${#files[@]}" -eq 0 ]; then
            echo "generated=false" >> "$GITHUB_OUTPUT"
            echo "Markdownファイルが見つからなかったため、PDF生成をスキップします。"
            exit 0
          fi

          for file in "${files[@]}"; do
            pdf_output="pdf/${file%.md}.pdf"
            mkdir -p "$(dirname "$pdf_output")"

            pandoc "$file" \
              --pdf-engine=xelatex \
              -H latex-header.tex \
              -V geometry:margin=1in \
              -o "$pdf_output"

            echo "Converted $file -> $pdf_output"
          done

          echo "generated=true" >> "$GITHUB_OUTPUT"

      - name: Upload PDF artifact
        if: steps.convert.outputs.generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: markdown-pdf
          path: pdf
          if-no-files-found: error

  generate-word:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Terraform docs
        uses: terraform-docs/gh-actions@v1.2.0
        with:
          working-dir: .
          config-file: .terraform-docs.yml

      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Verify reference.docx exists
        run: |
          if [ ! -f "reference.docx" ]; then
            echo "エラー: reference.docxが見つかりません。"
            exit 1
          fi
          echo "reference.docxが見つかりました。"

      - name: Convert Markdown files to Word
        id: convert
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.md')

          if [ "${#files[@]}" -eq 0 ]; then
            echo "generated=false" >> "$GITHUB_OUTPUT"
            echo "Markdownファイルが見つからなかったため、Word生成をスキップします。"
            exit 0
          fi

          for file in "${files[@]}"; do
            docx_output="docx/${file%.md}.docx"
            mkdir -p "$(dirname "$docx_output")"

            pandoc "$file" \
              --reference-doc=reference.docx \
              -o "$docx_output"

            echo "Converted $file -> $docx_output"
          done

          echo "generated=true" >> "$GITHUB_OUTPUT"

      - name: Upload DOCX artifact
        if: steps.convert.outputs.generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: markdown-docx
          path: docx
          if-no-files-found: error

  generate-pdf-from-html:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Terraform docs
        uses: terraform-docs/gh-actions@v1.2.0
        with:
          working-dir: .
          config-file: .terraform-docs.yml

      - name: Install pandoc and Japanese fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc fonts-noto-cjk fonts-noto-color-emoji

      - name: Install Chrome
        run: |
          sudo apt-get install -y wget gnupg
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Convert Markdown files to HTML
        id: convert-html
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git ls-files '*.md')

          if [ "${#files[@]}" -eq 0 ]; then
            echo "generated=false" >> "$GITHUB_OUTPUT"
            echo "Markdownファイルが見つからなかったため、HTML生成をスキップします。"
            exit 0
          fi

          mkdir -p html
          # 日本語フォント指定のCSSを一時ファイルに作成
          font_css_file=$(mktemp)
          cat > "$font_css_file" <<'EOF'
body, p, div, span, h1, h2, h3, h4, h5, h6, li, td, th {
  font-family: "Noto Sans CJK JP", "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Meiryo", "MS PGothic", sans-serif;
}
EOF

          for file in "${files[@]}"; do
            html_output="html/${file%.md}.html"
            mkdir -p "$(dirname "$html_output")"

            pandoc "$file" \
              --standalone \
              --self-contained \
              --css="$font_css_file" \
              -o "$html_output"

            echo "Converted $file -> $html_output"
          done
          
          rm -f "$font_css_file"

          echo "generated=true" >> "$GITHUB_OUTPUT"

      - name: Convert HTML files to PDF using Headless Chrome
        id: convert-pdf
        if: steps.convert-html.outputs.generated == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t html_files < <(find html -name '*.html' -type f)

          if [ "${#html_files[@]}" -eq 0 ]; then
            echo "generated=false" >> "$GITHUB_OUTPUT"
            echo "HTMLファイルが見つからなかったため、PDF生成をスキップします。"
            exit 0
          fi

          mkdir -p pdf-from-html
          for html_file in "${html_files[@]}"; do
            # HTMLファイルのパスから相対パスを取得
            relative_path="${html_file#html/}"
            pdf_output="pdf-from-html/${relative_path%.html}.pdf"
            mkdir -p "$(dirname "$pdf_output")"

            # Headless ChromeでHTMLを開いてPDFに変換
            google-chrome --headless \
              --disable-gpu \
              --no-sandbox \
              --print-to-pdf="$pdf_output" \
              --print-to-pdf-no-header \
              "file://$(pwd)/$html_file"

            echo "Converted $html_file -> $pdf_output"
          done

          echo "generated=true" >> "$GITHUB_OUTPUT"

      - name: Upload PDF from HTML artifact
        if: steps.convert-pdf.outputs.generated == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: markdown-pdf-from-html
          path: pdf-from-html
          if-no-files-found: error

